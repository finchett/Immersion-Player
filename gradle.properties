org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# The one version number for both apps and the release (scripts/release.sh). Android's
# versionCode is derived from it, so each part stays under 100.
appVersion=0.9.1
# Google Analytics (the Firebase project's web data stream) for the anonymous usage counts in
# core's UsageStats: analyticsMeasurementId and analyticsApiSecret. They ship inside the apps but
# stay out of the repo: set them in ~/.gradle/gradle.properties, and in CI as the repository
# secrets ANALYTICS_MEASUREMENT_ID and ANALYTICS_API_SECRET. Without them nothing is sent.
