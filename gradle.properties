org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# The one version number for both apps and the release (scripts/release.sh). Android's
# versionCode is derived from it, so each part stays under 100.
appVersion=0.7.0
# Google Analytics (the Firebase project's web data stream) for the anonymous usage counts in
# core's UsageStats: its measurement id and a Measurement Protocol API secret. They ship inside
# the apps, so they aren't secret; left empty, nothing is sent.
analyticsMeasurementId=
analyticsApiSecret=
