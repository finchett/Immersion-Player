# The Windows and Linux desktop builds. jpackage only packages for the system it runs on, so each
# is built on its own runner; scripts/release.sh takes the installers from the run for the commit
# it releases. macOS and Android are built on the Mac by release.sh itself.
name: Desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    # the anonymous usage counts' keys (UsageStats), kept as repository secrets
    env:
      ORG_GRADLE_PROJECT_analyticsMeasurementId: ${{ secrets.ANALYTICS_MEASUREMENT_ID }}
      ORG_GRADLE_PROJECT_analyticsApiSecret: ${{ secrets.ANALYTICS_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: libmpv
        shell: pwsh
        # shinchiro's build, the one mpv's own site points Windows users to
        run: |
          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z"
          Invoke-WebRequest $url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv-dev libmpv-2.dll
          New-Item -ItemType Directory -Force desktop/build/native/windows-x64 | Out-Null
          Copy-Item mpv-dev/libmpv-2.dll desktop/build/native/windows-x64/
      - name: Build
        shell: bash
        run: |
          ./gradlew --configure-on-demand --no-daemon :desktop:packageMsi
          version=$(sed -n 's/^appVersion=//p' gradle.properties)
          mkdir dist
          cp desktop/build/compose/binaries/main/msi/*.msi "dist/Immersion-Player-$version-windows-x64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.msi
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    # the anonymous usage counts' keys (UsageStats), kept as repository secrets
    env:
      ORG_GRADLE_PROJECT_analyticsMeasurementId: ${{ secrets.ANALYTICS_MEASUREMENT_ID }}
      ORG_GRADLE_PROJECT_analyticsApiSecret: ${{ secrets.ANALYTICS_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          ./gradlew --configure-on-demand --no-daemon :desktop:packageDeb
          version=$(sed -n 's/^appVersion=//p' gradle.properties)
          # the app loads the system's libmpv (and libtesseract, for picture subtitles), which
          # jpackage can't see, so the package says it needs them
          mkdir -p dist unpacked
          dpkg-deb -R desktop/build/compose/binaries/main/deb/*.deb unpacked
          control=unpacked/DEBIAN/control
          # its trailing blank line would start a second entry
          sed -i '/^$/d' $control
          if grep -q '^Depends:' $control; then
            sed -i 's/^Depends: \(.*\)$/Depends: \1, libmpv2 | libmpv1/' $control
          else
            echo 'Depends: libmpv2 | libmpv1' >> $control
          fi
          echo 'Recommends: libtesseract5, tesseract-ocr-jpn' >> $control
          cat $control
          dpkg-deb --root-owner-group -b unpacked "dist/Immersion-Player-$version-linux-x64.deb"
      - name: Install it and play something
        # the package installs on a clean system, and the app finds libmpv and opens a video with it
        run: |
          sudo apt-get update -q
          # the package adds itself to the menu, whose folders a server image lacks and a desktop has
          sudo mkdir -p /usr/share/applications /usr/share/desktop-directories
          sudo apt-get install -yq ./dist/*.deb xvfb ffmpeg imagemagick
          ffmpeg -v error -f lavfi -i testsrc=duration=20:size=640x360:rate=24 -c:v libx264 test.mkv
          # a virtual display and no GPU: the player passes over llvmpipe's emulated OpenGL for
          # software, so the screenshot shows the test pattern whole, not black or seamed
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            "/opt/immersion-player/bin/Immersion Player" "$PWD/test.mkv" > app.log 2>&1 &
            sleep 25
            import -window root shot.png
            kill %1' || true
          cat app.log
          grep "^video:" app.log
          cat ~/.local/share/immersion-player/errors.log 2>/dev/null || true
          ! grep -E "UnsatisfiedLinkError|Unable to load library|Exception in thread" app.log ~/.local/share/immersion-player/errors.log 2>/dev/null
          # the video takes the left of the window: its average brightness, 0 for black
          brightness=$(convert shot.png -crop 50%x100%+0+0 -colorspace gray -format "%[fx:mean]" info:)
          echo "video area brightness: $brightness"
          awk -v b="$brightness" 'BEGIN { exit !(b > 0.1) }'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-playback
          path: shot.png
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*.deb
          if-no-files-found: error

  # an AppImage for any Linux at least as new as Ubuntu 22.04 (its glibc), carrying its own libmpv
  # and libtesseract, unlike the .deb, which takes the system's
  linux-appimage:
    runs-on: ubuntu-22.04
    env:
      ORG_GRADLE_PROJECT_analyticsMeasurementId: ${{ secrets.ANALYTICS_MEASUREMENT_ID }}
      ORG_GRADLE_PROJECT_analyticsApiSecret: ${{ secrets.ANALYTICS_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libmpv1 libtesseract4 file
          ./gradlew --configure-on-demand --no-daemon :desktop:createDistributable
      - name: AppImage
        run: |
          version=$(sed -n 's/^appVersion=//p' gradle.properties)
          mkdir -p AppDir/opt dist
          # the app's folder is named after the app ("Immersion Player"); inside, it's immersion-player
          cp -r desktop/build/compose/binaries/main/app/*/ AppDir/opt/immersion-player
          ls AppDir/opt/immersion-player/bin
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          # libmpv and libtesseract, and every library they load that a desktop can't be counted on to have
          APPIMAGE_EXTRACT_AND_RUN=1 OUTPUT="dist/Immersion-Player-$version-linux-x64.AppImage" \
            ./linuxdeploy-x86_64.AppImage --appdir AppDir \
              --desktop-file desktop/appimage/immersion-player.desktop \
              --icon-file desktop/src/main/resources/icon.png --icon-filename immersion-player \
              --custom-apprun desktop/appimage/AppRun \
              --library /usr/lib/x86_64-linux-gnu/libmpv.so.1 \
              --library /usr/lib/x86_64-linux-gnu/libtesseract.so.4 \
              --output appimage
          ls -la dist
      - name: Play something on a clean Fedora
        # a different distribution from the one it was built on, with only a desktop's usual libraries
        run: |
          sudo apt-get install -yq ffmpeg
          ffmpeg -v error -f lavfi -i testsrc=duration=20:size=640x360:rate=24 -c:v libx264 test.mkv
          docker run --rm -v "$PWD:/w" -w /w fedora:41 bash -c '
            set -e
            dnf -y -q install xorg-x11-server-Xvfb xorg-x11-xauth which ImageMagick \
              libXext libXrender libXtst libXi libXrandr freetype fontconfig dejavu-sans-fonts \
              mesa-libGL mesa-libEGL mesa-dri-drivers alsa-lib \
              libgpg-error libusb1 pipewire-jack-audio-connection-kit-libs > /dev/null
            # (those last three linuxdeploy leaves to the system on purpose, JACK so it matches the
            # sound server; every Fedora desktop has them, a bare container does not)
            ./dist/*.AppImage --appimage-extract > /dev/null
            # every bundled library finds what it needs
            missing=$(for lib in squashfs-root/usr/lib/*.so*; do LD_LIBRARY_PATH=squashfs-root/usr/lib ldd "$lib" | grep "not found" || true; done)
            if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
            xvfb-run -a -s "-screen 0 1280x800x24" bash -c "
              ./squashfs-root/AppRun /w/test.mkv > app.log 2>&1 &
              sleep 30
              import -window root shot-appimage.png
              kill %1" || true
            cat app.log
            grep "^video:" app.log
            ! grep -E "UnsatisfiedLinkError|Unable to load library|Exception in thread" app.log
            brightness=$(convert shot-appimage.png -crop 50%x100%+0+0 -colorspace gray -format "%[fx:mean]" info:)
            echo "video area brightness: $brightness"
            awk -v b="$brightness" "BEGIN { exit !(b > 0.1) }"'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-appimage
          path: dist/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-appimage-playback
          path: shot-appimage.png
